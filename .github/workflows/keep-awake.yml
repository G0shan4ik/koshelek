name: Keep Supabase awake

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL is not set, skipping"
            exit 0
          fi
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "$SUPABASE_URL/rest/v1/?apikey=$SUPABASE_KEY"
